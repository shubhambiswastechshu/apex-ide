[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Lowest Rust that builds the locked dependencies (Slint 1.18 needs 1.92);
# checked by the `msrv` CI job.
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/shubhambiswastechshu/apex-ide"

[workspace.dependencies]
apex-core = { path = "crates/apex-core" }
apex-python = { path = "crates/apex-python" }
apex-editor = { path = "crates/apex-editor" }
apex-lsp = { path = "crates/apex-lsp" }
apex-themes = { path = "crates/apex-themes" }
apex-plugins = { path = "crates/apex-plugins" }
apex-db = { path = "crates/apex-db" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
ignore = "0.4"
which = "7"
semver = { version = "1", features = ["serde"] }
ropey = "1.6"
tree-sitter = "0.25"
tree-sitter-python = "0.23"
lsp-types = "0.97"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
tempfile = "3"
slint = "1.18"
slint-build = "1.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
